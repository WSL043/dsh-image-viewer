version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        update-types: [minor, patch]
  # DSH packages and historical fixtures belong to upstream-compatibility.yml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    allow:
      - dependency-name: "playwright"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "tsdown"
    # React must remain compatible with the DSH host major version.
    ignore:
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
    groups:
      tooling:
        update-types: [minor, patch]
