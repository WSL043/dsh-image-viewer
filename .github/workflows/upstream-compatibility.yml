name: Upstream runtime compatibility

on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-runtime-compatibility
  cancel-in-progress: false

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 24, package-manager-cache: false }
      - id: versions
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const response = await fetch('https://registry.npmjs.org/@deepseek-ai%2fdsh');
          if (!response.ok) throw new Error(`Registry HTTP ${response.status}`);
          const registry = await response.json();
          const tags = registry['dist-tags'];
          const observed = [...new Set([tags.latest, tags.alpha, tags.next].filter(Boolean))];
          const targets = JSON.parse(readFileSync('compatibility.json', 'utf8')).releaseTargets;
          if (!Array.isArray(targets) || targets.length === 0) throw new Error('No qualified release targets');
          for (const version of [...observed, ...targets]) {
            if (!/^\d+\.\d+\.\d+(?:-[\w.-]+)?$/.test(version) || !registry.versions[version]) throw new Error('Invalid published DSH version');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify([...new Set(targets)])}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `Observed official tags: ${observed.join(', ')}.\n\nThis package claims and tests only: ${targets.join(', ')}. Other tags need their own reviewed plugin version; a pass here does not qualify them.\n`);
          NODE
  acceptance:
    needs: versions
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dsh_version: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with: { version: 11.19.0, run_install: false }
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: git diff --exit-code -- lib
      - run: pnpm pack --pack-destination .artifacts
      - run: pnpm exec playwright install chromium
      - shell: pwsh
        run: ./.github/scripts/accept-official-release.ps1 -PackagePath (Get-Item .artifacts/dsh-image-viewer-*.tgz).FullName -DshVersion '${{ matrix.dsh_version }}'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: upstream-image-failure-${{ matrix.dsh_version }}
          path: ${{ runner.temp }}/dsh-image-viewer-official-*/
