name: Release

on:
  workflow_dispatch:
    inputs:
      contributor_prs:
        description: Comma-separated merged contributor PR numbers to credit
        required: false
        type: string
      release_notes_en:
        description: English user-facing release summary
        required: true
        type: string
      release_notes_zh:
        description: Chinese user-facing release summary
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      dsh_versions: ${{ steps.versions.outputs.dsh_versions }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 24, package-manager-cache: false }
      - id: versions
        run: node -e "const c=require('./compatibility.json'); require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'dsh_versions='+JSON.stringify([...new Set([c.latestTested,c.previews.at(-1)])])+'\n')"
  official-dsh-acceptance:
    name: Official DSH end-to-end acceptance (${{ matrix.dsh_version }})
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        dsh_version: ${{ fromJSON(needs.versions.outputs.dsh_versions) }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: pnpm pack --pack-destination .artifacts
      - run: pnpm exec playwright install chromium
      - name: Verify actual image operations and plugin lifecycle
        shell: pwsh
        run: ./.github/scripts/accept-official-release.ps1 -PackagePath (Get-Item .artifacts/dsh-image-viewer-*.tgz).FullName -DshVersion '${{ matrix.dsh_version }}'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: image-release-failure-${{ matrix.dsh_version }}
          path: ${{ runner.temp }}/dsh-image-viewer-official-*/
  release:
    needs: official-dsh-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Resolve immutable version
        id: version
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/main
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            npm_tag=latest
            prerelease=false
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]; then
            npm_tag=next
            prerelease=true
          else
            echo "Unsupported package version: $version" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "npm_tag=$npm_tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      - name: Require a release-bearing plugin change
        shell: bash
        run: |
          set -euo pipefail
          previous_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^)"
          release_files="$(git diff --name-only "$previous_tag...HEAD" -- \
            src cordis.patch.yml compatibility.json pnpm-lock.yaml \
            tsdown.config.mjs scripts/build-client.mjs)"
          git show "$previous_tag:package.json" \
            | jq '{name,main,exports,files,dsh,engines,dependencies,optionalDependencies,peerDependencies,peerDependenciesMeta}' \
            > "$RUNNER_TEMP/package-before.json"
          jq '{name,main,exports,files,dsh,engines,dependencies,optionalDependencies,peerDependencies,peerDependenciesMeta}' \
            package.json > "$RUNNER_TEMP/package-after.json"
          if ! cmp -s "$RUNNER_TEMP/package-before.json" "$RUNNER_TEMP/package-after.json"; then
            release_files="${release_files}${release_files:+$'\n'}package.json"
          fi
          if [[ -z "$release_files" ]]; then
            echo "No release-bearing plugin change since $previous_tag; do not publish a new npm version for docs, screenshots, tests, or release automation alone." >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
      - run: git diff --exit-code -- lib
      - name: Build immutable package
        shell: bash
        run: |
          rm -rf .release
          mkdir -p .release
          pnpm pack --pack-destination .release
          mv .release/dsh-image-viewer-*.tgz .release/dsh-image-viewer.tgz
          tar -xOf .release/dsh-image-viewer.tgz package/package.json \
            | jq -e --arg version "${{ steps.version.outputs.version }}" \
              '.name == "dsh-image-viewer" and .version == $version' >/dev/null
      - name: Write user-facing release notes
        env:
          CONTRIBUTOR_PRS: ${{ inputs.contributor_prs }}
          GH_TOKEN: ${{ github.token }}
          NOTES_EN: ${{ inputs.release_notes_en }}
          NOTES_ZH: ${{ inputs.release_notes_zh }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$NOTES_EN" == *'\n'* || "$NOTES_ZH" == *'\n'* ]]; then
            echo 'Release notes must contain real line breaks, not literal \n sequences.' >&2
            exit 1
          fi
          : > .release/contributors.en.md
          : > .release/contributors.zh-CN.md
          if [[ -n "${CONTRIBUTOR_PRS:-}" ]]; then
            IFS=',' read -ra contributor_pr_numbers <<< "$CONTRIBUTOR_PRS"
            for raw_pr in "${contributor_pr_numbers[@]}"; do
              pr_number="$(xargs <<< "$raw_pr")"
              [[ "$pr_number" =~ ^[1-9][0-9]*$ ]] || {
                echo "Invalid contributor PR number: $raw_pr" >&2
                exit 1
              }
              pr_json="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json author,mergedAt,number,url)"
              merged_at="$(jq -r '.mergedAt' <<< "$pr_json")"
              test "$merged_at" != 'null'
              author="$(jq -r '.author.login' <<< "$pr_json")"
              number="$(jq -r '.number' <<< "$pr_json")"
              url="$(jq -r '.url' <<< "$pr_json")"
              printf -- '- Thanks to [@%s](https://github.com/%s) for contributing in [#%s](%s).\n' "$author" "$author" "$number" "$url" >> .release/contributors.en.md
              printf -- '- 感谢 [@%s](https://github.com/%s) 在 [#%s](%s) 提交贡献。\n' "$author" "$author" "$number" "$url" >> .release/contributors.zh-CN.md
            done
          fi
          cat > .release/release.md <<NOTES
          ## What's new

          $NOTES_EN
          NOTES
          if [[ -s .release/contributors.en.md ]]; then
            printf '\n## Contributors\n\n' >> .release/release.md
            cat .release/contributors.en.md >> .release/release.md
          fi
          cat >> .release/release.md <<NOTES

          ## Install or update

          \`\`\`sh
          dsh plugin --profile web add dsh-image-viewer@$VERSION
          \`\`\`

          Restart DSH manually after saving active work.

          ## 中文

          ## 更新内容

          $NOTES_ZH
          NOTES
          if [[ -s .release/contributors.zh-CN.md ]]; then
            printf '\n## 贡献者\n\n' >> .release/release.md
            cat .release/contributors.zh-CN.md >> .release/release.md
          fi
          cat >> .release/release.md <<NOTES

          ## 安装或更新

          \`\`\`sh
          dsh plugin --profile web add dsh-image-viewer@$VERSION
          \`\`\`

          保存正在进行的工作后手动重启 DSH。
          NOTES
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@12.0.2
      - name: Publish or reconcile with npm
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          npm_tag="${{ steps.version.outputs.npm_tag }}"
          prerelease="${{ steps.version.outputs.prerelease }}"
          latest_before="$(npm view dsh-image-viewer dist-tags.latest 2>/dev/null || true)"
          if tarball="$(npm view "dsh-image-viewer@$version" dist.tarball 2>/dev/null)"; then
            curl --fail --location --silent --show-error "$tarball" --output "$RUNNER_TEMP/npm.tgz"
            if ! cmp -s .release/dsh-image-viewer.tgz "$RUNNER_TEMP/npm.tgz"; then
              mkdir -p "$RUNNER_TEMP/local" "$RUNNER_TEMP/remote"
              tar -xzf .release/dsh-image-viewer.tgz -C "$RUNNER_TEMP/local"
              tar -xzf "$RUNNER_TEMP/npm.tgz" -C "$RUNNER_TEMP/remote"
              diff -qr --strip-trailing-cr --exclude='*.map' "$RUNNER_TEMP/local/package" "$RUNNER_TEMP/remote/package"
              cp "$RUNNER_TEMP/npm.tgz" .release/dsh-image-viewer.tgz
            fi
          else
            npm publish .release/dsh-image-viewer.tgz --access public --tag "$npm_tag"
          fi
          expected_latest="$version"
          if [[ "$prerelease" == true ]]; then
            expected_latest="$latest_before"
          fi
          tag_after=''
          latest_after=''
          for attempt in {1..60}; do
            tag_after="$(npm view dsh-image-viewer "dist-tags.$npm_tag" 2>/dev/null || true)"
            latest_after="$(npm view dsh-image-viewer dist-tags.latest 2>/dev/null || true)"
            if [[ "$tag_after" == "$version" && "$latest_after" == "$expected_latest" ]]; then
              break
            fi
            sleep 5
          done
          if [[ "$tag_after" != "$version" || "$latest_after" != "$expected_latest" ]]; then
            echo "npm tag propagation did not reconcile: expected $npm_tag=$version/latest=$expected_latest, observed $npm_tag=$tag_after/latest=$latest_after. The package may already be published; rerun reconciliation without changing its version." >&2
            exit 1
          fi
      - name: Create verified draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          if [[ "$PRERELEASE" == true ]]; then
            release_mode=(--draft --prerelease)
            expected_prerelease=true
          else
            release_mode=(--draft --latest)
            expected_prerelease=false
          fi
          target=(--target "$GITHUB_SHA")
          if tagged_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null)"; then
            test "$tagged_sha" = "$GITHUB_SHA"
            target=(--verify-tag)
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${target[@]}" \
            --title "$TAG" --notes-file .release/release.md "${release_mode[@]}"
          gh release upload "$TAG" .release/dsh-image-viewer.tgz --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets \
            | jq -e --argjson expected_prerelease "$expected_prerelease" \
              '.isDraft == true and .isPrerelease == $expected_prerelease and (.assets | any(.name == "dsh-image-viewer.tgz" and .size > 0))' >/dev/null
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          if [[ "$PRERELEASE" == true ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
      - name: Cleanup failed draft
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)" == true ]]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" -y || true
          fi
