name: Risk-based CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      behavior: ${{ steps.plan.outputs.behavior }}
      delivery: ${{ steps.plan.outputs.delivery }}
      official: ${{ steps.plan.outputs.official }}
      dsh_versions: ${{ steps.versions.outputs.dsh_versions }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v6
        with: { node-version: 24, package-manager-cache: false }
      - id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          published="$(npm view dsh-image-viewer dist-tags.latest)"
          node scripts/ci-change-plan.mjs --base "$BASE_SHA" --published "$published"
      - id: versions
        run: node -e "const c=require('./compatibility.json'); require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'dsh_versions='+JSON.stringify([...new Set(c.releaseTargets ?? [c.latestTested,c.previews.at(-1)])])+'\n')"

  behavior:
    needs: plan
    if: needs.plan.outputs.behavior == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with: { version: 11.19.0, run_install: false }
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run zoom, pan, gallery, download, and annotation behavior
        run: pnpm run test:behavior
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/test-viewer-browser.mjs .artifacts/browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: viewer-browser-failure
          path: .artifacts/browser/
          include-hidden-files: true
      - run: git diff --exit-code -- lib
      - run: pnpm pack --pack-destination .artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: image-viewer-${{ github.sha }}
          path: .artifacts/*.tgz
          if-no-files-found: error
          include-hidden-files: true

  delivery:
    needs: plan
    if: needs.plan.outputs.delivery == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with: { version: 11.19.0, run_install: false }
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run test:delivery

  official-dsh:
    name: Official DSH end-to-end acceptance (${{ matrix.dsh_version }})
    strategy:
      fail-fast: false
      matrix:
        dsh_version: ${{ fromJSON(needs.plan.outputs.dsh_versions) }}
    needs: [plan, behavior]
    if: needs.plan.outputs.official == 'true' && needs.behavior.result == 'success'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with: { version: 11.19.0, run_install: false }
      - uses: actions/setup-node@v6
        with: { node-version: 24, package-manager-cache: false }
      - uses: actions/download-artifact@v8
        with:
          name: image-viewer-${{ github.sha }}
          path: .candidate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install chromium
      - name: Verify actual gallery, zoom, pan, notes, download and plugin lifecycle
        shell: pwsh
        run: ./.github/scripts/accept-official-release.ps1 -PackagePath (Get-Item .candidate/dsh-image-viewer-*.tgz).FullName -DshVersion '${{ matrix.dsh_version }}'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: image-failure-${{ matrix.dsh_version }}
          path: ${{ runner.temp }}/dsh-image-viewer-official-*/
